version: 2

# 1. Uncomment the blocks for your stacks.
# 2. Delete unused blocks (including GitHub Actions if you have no workflows).
# Paths default to the repository root; change them only for nested projects.
updates:
  # Keep only if the target repository uses GitHub Actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"

