version: 2

updates:
  # Keep only if the target repository uses GitHub Actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"

  # Uncomment and duplicate this block for each ecosystem and manifest location.
  # Change npm to the ecosystem identifier for your stack (see README.md).
